<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A11MEANS — Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.05), rgba(0,0,0,0.05)),
        url('https://raw.githubusercontent.com/28miles/28miles.github.io/main/IMG_1853.jpeg') center / cover no-repeat;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 80px;
    }

    .brand-stack {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
    }

    .brand-tag {
      padding: 10px 18px;
      border: 2px solid rgba(0,0,0,0.95);
      background: rgba(255,255,255,0.10);
      color: rgba(0,0,0,0.95);
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .coming-soon {
      font-family: "Segoe Script", "Lucida Handwriting", "Bradley Hand", cursive;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(24px, 2.8vw, 42px);
      letter-spacing: 1px;
      color: rgba(255,255,255,0.80);
      text-shadow: 0 2px 8px rgba(0,0,0,0.12);
      line-height: 1;
    }

    .bottom-cta {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 3;
      width: min(90vw, 420px);
      text-align: center;
    }

    .bottom-cta a {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      border: 1px solid rgba(0,0,0,0.8);
      background: rgba(255,255,255,0.18);
      border-radius: 999px;
      color: rgba(0,0,0,0.9);
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bottom-cta a:hover {
      background: rgba(0,0,0,0.9);
      color: rgba(255,255,255,0.95);
    }

    @media (max-width: 520px) {
      .brand-stack { top: 18px; }
      .brand-tag { letter-spacing: 2px; }
      .bottom-cta { bottom: 18px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="brand-stack">
      <div class="brand-tag">A11MEANS</div>
      <div class="coming-soon">Coming Soon</div>
    </div>

    <div class="bottom-cta">
      <a href="mailto:support@a11means.us">Get Email Notifications</a>
    </div>
  </div>
</body>
</html>
