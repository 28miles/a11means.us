<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#eadfce" />
  <meta name="description" content="A11MEANS — coming soon. Sign up for email updates." />
  <title>A11MEANS — Coming Soon</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171412;
      --paper: #eadfce;
      --paper-light: #f5eee4;
      --red: #861c2a;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow: hidden;
      color: var(--ink);
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--paper);
      background-image:
        radial-gradient(ellipse at 18% 22%, rgba(255,255,255,.52), transparent 35%),
        radial-gradient(ellipse at 82% 76%, rgba(117,73,48,.15), transparent 42%),
        linear-gradient(135deg, #f3ecdf, #d9c9b3);
    }

    .page {
      position: relative;
      isolation: isolate;
      display: grid;
      min-height: 100vh;
      min-height: 100svh;
      place-items: center;
      padding: 150px 24px 110px;
      overflow: hidden;
    }

    /* A subtle framed, warm-toned backdrop keeps the page complete without remote assets. */
    .backdrop {
      position: absolute;
      z-index: -1;
      inset: 18px;
      border: 1px solid rgba(23,20,18,.18);
      background:
        linear-gradient(120deg, rgba(255,255,255,.20), transparent 48%),
        radial-gradient(ellipse at 50% 120%, rgba(110,44,33,.12), transparent 60%);
      box-shadow: inset 0 0 0 7px rgba(255,255,255,.08);
      pointer-events: none;
    }

    #petals {
      position: fixed;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .brand-stack {
      position: absolute;
      z-index: 2;
      top: clamp(24px, 6vh, 52px);
      left: 50%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100vw - 32px);
      text-align: center;
      transform: translateX(-50%);
    }

    .brand-tag {
      padding: 12px 20px 11px 24px;
      border: 2px solid var(--ink);
      background: rgba(255,255,255,.12);
      font-size: clamp(15px, 2.4vw, 22px);
      font-weight: 700;
      letter-spacing: .34em;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .coming-soon {
      position: relative;
      font-family: "Segoe Script", "Lucida Handwriting", "Bradley Hand", cursive;
      font-size: clamp(32px, 5vw, 54px);
      font-style: italic;
      line-height: 1.15;
      transform: rotate(-4deg);
    }

    .coming-soon::after {
      position: absolute;
      right: 2%;
      bottom: -7px;
      left: 9%;
      height: 2px;
      border-radius: 50%;
      background: var(--ink);
      content: "";
      transform: rotate(-2deg) skewX(-18deg);
    }

    .center-mark {
      z-index: 0;
      color: rgba(23,20,18,.06);
      font-size: clamp(90px, 24vw, 270px);
      font-weight: 800;
      letter-spacing: -.12em;
      line-height: .8;
      user-select: none;
    }

    .bottom-cta {
      position: absolute;
      z-index: 2;
      right: 24px;
      bottom: clamp(24px, 5vh, 42px);
      left: 24px;
      width: min(90vw, 420px);
      margin-inline: auto;
      text-align: center;
    }

    .bottom-cta a {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: rgba(255,255,255,.22);
      color: var(--ink);
      font-size: 12px;
      letter-spacing: .16em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background-color .2s ease, color .2s ease, transform .2s ease;
    }

    .bottom-cta a:hover,
    .bottom-cta a:focus-visible {
      background: var(--ink);
      color: #fff;
      transform: translateY(-2px);
    }

    .bottom-cta a:focus-visible { outline: 3px solid var(--red); outline-offset: 4px; }

    @media (max-width: 520px) {
      .page { padding-inline: 16px; }
      .backdrop { inset: 10px; }
      .brand-tag { letter-spacing: .2em; }
      .bottom-cta { right: 16px; left: 16px; width: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
      #petals { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="backdrop" aria-hidden="true"></div>
    <canvas id="petals" aria-hidden="true"></canvas>

    <header class="brand-stack">
      <div class="brand-tag">A11MEANS</div>
      <div class="coming-soon">Coming Soon</div>
    </header>

    <div class="center-mark" aria-hidden="true">A</div>

    <div class="bottom-cta">
      <a href="mailto:support@a11means.us?subject=A11MEANS%20updates">Get Email Notifications</a>
    </div>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('petals');
      const ctx = canvas && canvas.getContext('2d');
      if (!ctx) return;

      const colors = ['#e99bad', '#f4b9c6', '#ffd5df', '#d98299', '#171412', '#171412', '#861c2a', '#c51f32'];
      const petals = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let lastTime = 0;
      let animationFrame = 0;
      let paused = document.hidden;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makePetal(initial) {
        const color = colors[Math.floor(Math.random() * colors.length)];
        const dark = color === '#171412';
        return {
          x: Math.random() * width,
          y: initial ? Math.random() * height : -30,
          size: dark ? 9 + Math.random() * 8 : 7 + Math.random() * 9,
          speed: 22 + Math.random() * 24,
          sway: 10 + Math.random() * 22,
          phase: Math.random() * Math.PI * 2,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - .5) * 2.4,
          color,
          dark
        };
      }

      function drawPetal(petal) {
        ctx.save();
        ctx.translate(petal.x, petal.y);
        ctx.rotate(petal.angle);
        ctx.fillStyle = petal.color;
        if (petal.dark) {
          ctx.shadowColor = 'rgba(255,255,255,.75)';
          ctx.shadowBlur = 3;
        }
        ctx.beginPath();
        ctx.moveTo(0, -petal.size);
        ctx.bezierCurveTo(petal.size * 1.05, -petal.size * .25, petal.size * .7, petal.size * .8, 0, petal.size);
        ctx.bezierCurveTo(-petal.size * .8, petal.size * .75, -petal.size, -petal.size * .25, 0, -petal.size);
        ctx.fill();
        ctx.restore();
      }

      function animate(now) {
        if (paused) return;
        const delta = Math.min((now - lastTime) / 1000 || 0, .05);
        lastTime = now;
        ctx.clearRect(0, 0, width, height);
        for (const petal of petals) {
          petal.phase += delta * .9;
          petal.y += petal.speed * delta;
          petal.x += Math.sin(petal.phase) * petal.sway * delta;
          petal.angle += petal.spin * delta;
          if (petal.y > height + 32) Object.assign(petal, makePetal(false));
          drawPetal(petal);
        }
        animationFrame = window.requestAnimationFrame(animate);
      }

      function start() {
        if (paused || animationFrame) return;
        lastTime = 0;
        animationFrame = window.requestAnimationFrame(animate);
      }

      function stop() {
        if (animationFrame) window.cancelAnimationFrame(animationFrame);
        animationFrame = 0;
      }

      resize();
      const count = width < 600 ? 16 : 28;
      for (let i = 0; i < count; i += 1) petals.push(makePetal(true));
      window.addEventListener('resize', resize, { passive: true });
      document.addEventListener('visibilitychange', () => {
        paused = document.hidden;
        if (paused) stop(); else start();
      });
      start();
    })();
  </script>
</body>
</html>
