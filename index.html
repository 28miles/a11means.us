<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A11MEANS — Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100vh; }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        linear-gradient(rgba(0,0,0,0.03), rgba(0,0,0,0.03)),
        url('https://raw.githubusercontent.com/28miles/28miles.github.io/main/IMG_1853.jpeg') center / cover no-repeat;
    }

    #petals {
      position: fixed;
      inset: 0;
      z-index: 10;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 72px 24px 84px;
    }

    .brand-stack {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }

    .brand-tag {
      padding: 10px 18px;
      border: 2px solid #000;
      background: rgba(255,255,255,0.10);
      color: #000;
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .coming-soon {
      position: relative;
      color: #000;
      font-family: "Segoe Script", "Lucida Handwriting", "Bradley Hand", cursive;
      font-size: clamp(26px, 3vw, 46px);
      font-weight: 400;
      font-style: italic;
      letter-spacing: 1px;
      line-height: 1;
      transform: rotate(-4deg);
    }

    .coming-soon::after {
      content: "";
      position: absolute;
      left: 10%;
      right: 2%;
      bottom: -7px;
      height: 2px;
      background: rgba(0,0,0,0.8);
      border-radius: 50%;
      transform: rotate(-2deg) skewX(-18deg);
    }

    .bottom-cta {
      position: absolute;
      left: 50%;
      bottom: 26px;
      transform: translateX(-50%);
      z-index: 20;
      width: min(90vw, 420px);
      text-align: center;
    }

    .bottom-cta a {
      display: inline-block;
      width: 100%;
      padding: 12px 20px;
      border: 1px solid #000;
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      color: #000;
      text-decoration: none;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bottom-cta a:hover { background: #000; color: #fff; }

    @media (max-width: 520px) {
      .brand-stack { top: 18px; }
      .brand-tag { letter-spacing: 2px; }
      .bottom-cta { bottom: 18px; }
    }

    @media (prefers-reduced-motion: reduce) { #petals { display: none; } }
  </style>
</head>
<body>
  <canvas id="petals" aria-hidden="true"></canvas>

  <div class="page">
    <div class="brand-stack">
      <div class="brand-tag">A11MEANS</div>
      <div class="coming-soon">Coming Soon</div>
    </div>

    <div class="bottom-cta">
      <a href="mailto:support@a11means.us">Get Email Notifications</a>
    </div>
  </div>

  <script>
    (() => {
      const canvas = document.getElementById('petals');
      const ctx = canvas.getContext('2d');
      const colors = ['#e99bad', '#f4b9c6', '#ffd5df', '#d98299', '#000000', '#8f101c', '#c51f32'];
      const petals = [];
      let width = 0;
      let height = 0;
      let dpr = 1;
      let last = 0;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width * dpr;
        canvas.height = height * dpr;
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function makePetal(initial) {
        return {
          x: Math.random() * width,
          y: initial ? Math.random() * height : -36,
          size: 8 + Math.random() * 9,
          fall: 18 + Math.random() * 20,
          sway: 8 + Math.random() * 18,
          phase: Math.random() * Math.PI * 2,
          angle: Math.random() * Math.PI * 2,
          spin: (Math.random() - 0.5) * 2,
          color: colors[Math.floor(Math.random() * colors.length)]
        };
      }

      function reset(petal) { Object.assign(petal, makePetal(false)); }

      function draw(petal) {
        ctx.save();
        ctx.translate(petal.x, petal.y);
        ctx.rotate(petal.angle);
        ctx.fillStyle = petal.color;
        ctx.beginPath();
        ctx.moveTo(0, -petal.size);
        ctx.bezierCurveTo(petal.size * 1.1, -petal.size * 0.25, petal.size * 0.7, petal.size, 0, petal.size * 1.05);
        ctx.bezierCurveTo(-petal.size * 0.75, petal.size * 0.7, -petal.size * 0.95, -petal.size * 0.3, 0, -petal.size);
        ctx.fill();
        ctx.restore();
      }

      function animate(now) {
        const delta = Math.min((now - last) / 1000 || 0, 0.05);
        last = now;
        ctx.clearRect(0, 0, width, height);
        petals.forEach((petal) => {
          petal.phase += delta * 0.9;
          petal.y += petal.fall * delta;
          petal.x += Math.sin(petal.phase) * petal.sway * delta;
          petal.angle += petal.spin * delta;
          if (petal.y > height + 36) reset(petal);
          draw(petal);
        });
        requestAnimationFrame(animate);
      }

      resize();
      const count = width < 600 ? 16 : 26;
      for (let i = 0; i < count; i += 1) petals.push(makePetal(true));
      window.addEventListener('resize', resize, { passive: true });
      requestAnimationFrame(animate);
    })();
  </script>
</body>
</html>
