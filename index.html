<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11MEANS — Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      font-family: Arial, Helvetica, sans-serif;
      /* Keep the clothing image clear and unobstructed. */
      background: #d8d0c5 url('https://raw.githubusercontent.com/28miles/28miles.github.io/main/IMG_1853.jpeg') center / cover no-repeat;
    }

    .brand-tag {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      padding: 10px 18px;
      border: 2px solid #000;
      color: #000;
      background: rgba(255, 255, 255, 0.14);
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 700;
      letter-spacing: 4px;
      white-space: nowrap;
    }

    .content {
      position: relative;
      z-index: 2;
      width: min(94vw, 1200px);
      text-align: center;
    }

    /* White, highly transparent watermark so the clothing remains prominent. */
    .coming-soon {
      color: rgba(255, 255, 255, 0.12);
      font-size: clamp(42px, 10vw, 138px);
      font-weight: 900;
      line-height: 0.95;
      letter-spacing: clamp(2px, 1vw, 14px);
      white-space: nowrap;
      text-shadow: none;
    }

    .email-link { margin-top: 34px; }

    .email-link a {
      display: inline-block;
      padding: 10px 18px;
      border: 1px solid #000;
      border-radius: 4px;
      color: #000;
      font-size: 12px;
      text-decoration: none;
      transition: background-color .2s ease, color .2s ease;
    }

    .email-link a:hover { background: #000; color: #fff; }

    @media (max-width: 520px) {
      .brand-tag { top: 20px; letter-spacing: 2px; }
      .coming-soon { white-space: normal; font-size: clamp(42px, 14vw, 70px); }
    }
  </style>
</head>
<body>
  <header class="brand-tag">A11MEANS</header>

  <main class="content">
    <h1 class="coming-soon">COMING SOON</h1>
    <div class="email-link">
      <a href="mailto:support@a11means.us">Get Email Notifications</a>
    </div>
  </main>
</body>
</html>
