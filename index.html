<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A11MEANS — Coming Soon</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      min-height: 100vh;
    }

    body {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #d8d0c5 url('https://raw.githubusercontent.com/28miles/28miles.github.io/main/IMG_1853.jpeg') center / cover no-repeat;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px 48px;
    }

    .brand-tag {
      position: absolute;
      top: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      padding: 10px 18px;
      border: 2px solid rgba(0, 0, 0, 0.95);
      color: rgba(0, 0, 0, 0.95);
      background: rgba(255, 255, 255, 0.12);
      font-size: clamp(14px, 2.2vw, 22px);
      font-weight: 700;
      letter-spacing: 4px;
      white-space: nowrap;
    }

    .hero {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      margin-top: 12px;
    }

    .coming-soon {
      font-family: Georgia, "Times New Roman", serif;
      font-style: italic;
      font-weight: 600;
      font-size: clamp(28px, 4vw, 56px);
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.9);
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
      line-height: 1.1;
    }

    .bottom-cta {
      position: absolute;
      bottom: 26px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      width: min(92vw, 420px);
      text-align: center;
    }

    .bottom-cta a {
      display: inline-block;
      width: 100%;
      padding: 12px 18px;
      text-decoration: none;
      color: rgba(0, 0, 0, 0.9);
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(0, 0, 0, 0.8);
      border-radius: 999px;
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .bottom-cta a:hover {
      background: rgba(0, 0, 0, 0.9);
      color: rgba(255, 255, 255, 0.95);
    }

    @media (max-width: 520px) {
      .brand-tag {
        top: 20px;
        letter-spacing: 2px;
      }

      .bottom-cta {
        bottom: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="brand-tag">A11MEANS</header>

    <div class="hero">
      <div class="coming-soon">Coming Soon</div>
    </div>

    <div class="bottom-cta">
      <a href="mailto:support@a11means.us">Get Email Notifications</a>
    </div>
  </div>
</body>
</html>
