<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>A11MEANS — Coming Soon</title>
    <style>
      :root {
        --bg-cream: #f5efe7;
        --ink: #111111;
        --muted: rgba(17, 17, 17, 0.72);
        --panel: rgba(255, 255, 255, 0.18);
        --line: rgba(17, 17, 17, 0.7);
        --accent: #c72d4d;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html, body {
        width: 100%;
        min-height: 100vh;
      }

      body {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: Arial, Helvetica, sans-serif;
        color: var(--ink);
        background-color: var(--bg-cream);
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.12)),
          radial-gradient(circle at 15% 20%, rgba(199, 45, 77, 0.18), transparent 30%),
          radial-gradient(circle at 80% 25%, rgba(96, 72, 52, 0.14), transparent 32%),
          linear-gradient(135deg, #f4efe7 0%, #efe6dc 46%, #e9e1d5 100%);
      }

      .page {
        position: relative;
        width: 100%;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 72px 24px 84px;
      }

      .brand-stack {
        position: absolute;
        top: 28px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        text-align: center;
      }

      .brand-tag {
        padding: 12px 20px;
        border: 2px solid var(--ink);
        background: rgba(255, 255, 255, 0.14);
        color: var(--ink);
        font-size: clamp(15px, 2.3vw, 22px);
        font-weight: 700;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .coming-soon {
        position: relative;
        color: var(--ink);
        font-family: "Segoe Script", "Lucida Handwriting", "Bradley Hand", cursive;
        font-size: clamp(28px, 3vw, 48px);
        font-weight: 400;
        font-style: italic;
        letter-spacing: 0.04em;
        line-height: 1;
        transform: rotate(-4deg);
      }

      .coming-soon::after {
        content: "";
        position: absolute;
        left: 10%;
        right: 2%;
        bottom: -8px;
        height: 2px;
        background: var(--line);
        border-radius: 50%;
        transform: rotate(-2deg) skewX(-18deg);
      }

      .bottom-cta {
        position: absolute;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        z-index: 2;
        width: min(90vw, 420px);
        text-align: center;
      }

      .bottom-cta a {
        display: inline-block;
        width: 100%;
        padding: 12px 20px;
        border: 1px solid var(--ink);
        background: rgba(255, 255, 255, 0.2);
        border-radius: 999px;
        color: var(--ink);
        text-decoration: none;
        font-size: 12px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        transition: background-color 0.2s ease, color 0.2s ease, transform 0.2s ease;
      }

      .bottom-cta a:hover,
      .bottom-cta a:focus-visible {
        background: var(--ink);
        color: #fff;
        transform: translateY(-1px);
      }

      @media (max-width: 520px) {
        .brand-stack {
          top: 18px;
        }

        .brand-tag {
          letter-spacing: 0.18em;
        }

        .bottom-cta {
          bottom: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="brand-stack" aria-label="A11MEANS brand and coming soon message">
        <div class="brand-tag">A11MEANS</div>
        <div class="coming-soon">Coming Soon</div>
      </div>

      <div class="bottom-cta">
        <a href="mailto:support@a11means.us">Get Email Notifications</a>
      </div>
    </div>
  </body>
</html>
