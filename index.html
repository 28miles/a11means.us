<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A11MEANS - Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-image: url('https://raw.githubusercontent.com/28miles/28miles.github.io/main/IMG_1853.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: Arial, sans-serif;
            position: relative;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
        }
        
        header {
            color: #000;
            font-size: 28px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.3);
            letter-spacing: 3px;
        }
        
        .watermark {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-45deg);
            font-size: 140px;
            font-weight: bold;
            color: rgba(255, 255, 255, 0.15);
            white-space: nowrap;
            pointer-events: none;
            z-index: 1;
            letter-spacing: 15px;
        }
        
        .email-link {
            margin-top: 20px;
        }
        
        .email-link a {
            font-size: 12px;
            color: #000;
            text-decoration: none;
            border: 1px solid #000;
            padding: 8px 16px;
            border-radius: 4px;
            transition: all 0.3s ease;
            display: inline-block;
        }
        
        .email-link a:hover {
            background-color: #000;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="watermark">COMING SOON</div>
    
    <div class="container">
        <header>A11MEANS</header>
        
        <div class="email-link">
            <a href="mailto:support@a11means.us">Get Email Notifications</a>
        </div>
    </div>
</body>
</html>
